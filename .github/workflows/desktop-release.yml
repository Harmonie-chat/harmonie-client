name: 🖥️ Desktop Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 1.0.0'
        required: true
      release_body:
        description: 'Release notes shown on GitHub'
        required: false
        default: 'Desktop release for Harmonie.'

permissions:
  contents: write

jobs:
  publish-tauri:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin
          - name: macOS Intel
            platform: macos-latest
            args: --target x86_64-apple-darwin
          - name: Windows
            platform: windows-latest
            args: ''
          - name: Linux
            platform: ubuntu-22.04
            args: ''

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v5

      - name: 🧰 Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: 🥡 Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.1

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: 🦀 Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: 🎯 Add macOS Rust targets
        if: startsWith(matrix.platform, 'macos')
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: 🧊 Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/harmonie/src-tauri -> target

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔢 Apply release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const version = process.env.RELEASE_VERSION.replace(/^v/, '');
          const pubkey = process.env.TAURI_UPDATER_PUBKEY;

          if (!pubkey) {
            throw new Error('TAURI_UPDATER_PUBKEY secret is required for desktop releases.');
          }

          const packagePath = 'apps/harmonie/package.json';
          const packageJson = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          packageJson.version = version;
          fs.writeFileSync(packagePath, `${JSON.stringify(packageJson, null, 2)}\n`);

          const tauriPath = 'apps/harmonie/src-tauri/tauri.conf.json';
          const tauriConfig = JSON.parse(fs.readFileSync(tauriPath, 'utf8'));
          tauriConfig.version = version;
          tauriConfig.plugins.updater.pubkey = pubkey;
          fs.writeFileSync(tauriPath, `${JSON.stringify(tauriConfig, null, 2)}\n`);

          const cargoPath = 'apps/harmonie/src-tauri/Cargo.toml';
          const cargo = fs.readFileSync(cargoPath, 'utf8');
          fs.writeFileSync(cargoPath, cargo.replace(/^version = ".*"$/m, `version = "${version}"`));
          NODE

      - name: 🏗️ Build and publish desktop app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          APPLE_SIGNING_IDENTITY: '-'
        with:
          projectPath: apps/harmonie
          tagName: harmonie-v__VERSION__
          releaseName: Harmonie v__VERSION__
          releaseBody: ${{ inputs.release_body }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  publish-release:
    name: Publish desktop release
    runs-on: ubuntu-latest
    needs: publish-tauri
    steps:
      - name: 🚀 Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${RELEASE_VERSION#v}"
          gh release edit "harmonie-v${VERSION}" --draft=false --latest
