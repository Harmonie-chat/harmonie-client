name: 🚀 CI - Checks & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write

jobs:
  checks-and-build:
    runs-on: ubuntu-latest
    name: ✅ Checks & Build

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v5

      - name: 🥡 Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.1

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🎨 Format check
        run: pnpm format:check

      - name: 🔍 Lint
        run: pnpm lint

      - name: 🏗️ Build
        run: pnpm build

  react-doctor:
    runs-on: ubuntu-latest
    name: 💉 React Doctor
    needs: checks-and-build

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v5

      - name: 🩻 React Doctor
        uses: millionco/react-doctor@v2
